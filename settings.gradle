pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url 'https://maven.fabricmc.net/' }            // Fabric Loom, Loader, API
        maven { url 'https://maven.neoforged.net/releases/' }  // NeoForge / NeoForm / ModDevGradle
        maven { url 'https://maven.minecraftforge.net/' }      // ForgeGradle / Forge
    }
    // Plugin versions are declared here so each module applies them by id only.
    plugins {
        id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
        id 'net.neoforged.moddev' version '2.0.148'      // common (NeoForm) + neoforge
        id 'net.fabricmc.fabric-loom' version '1.18.4' // fabric — 1.17 handles de-obf 26.x (omit mappings)
        id 'net.fabricmc.fabric-loom-remap' version '1.18.4' // fabric on obfuscated 1.21.x (Mojang mappings + remapJar)
        id 'net.minecraftforge.gradle' version '7.0.40'  // forge — FG 7 handles de-obf 26.x
        id 'net.minecraftforge.jarjar' version '0.2.3'   // forge Jar-in-Jar dependencies
        id 'dev.kikugie.stonecutter' version '0.9.8'     // version axis (per-MC nodes)
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention'
    id 'dev.kikugie.stonecutter'
}

rootProject.name = 'nerolink'

// ---------------------------------------------------------------------------
// Stonecutter version tree (replaces the old `-Pminecraft_version` axis +
// the flat include 'common'/'fabric'/'neoforge').
//
//   branch  -> loader   (fabric, neoforge, forge) : its own dir + build.gradle
//   version -> MC build (26.1.2, 26.2, 26.3)       : a real subproject per cell
//
// Produces the nine cells as DISTINCT Gradle projects, each with its own
// resolved classpath:
//   :fabric:26.1.2   :fabric:26.2
//   :neoforge:26.1.2 :neoforge:26.2
//   :forge:26.1.2    :forge:26.2
// That per-node classpath is what lets VS Code switch versions on selection
// (one .classpath per node) instead of every config sharing one pinned classpath.
//
// `common` is NOT a node — it is shared source pulled into every node via
// rootProject.ext.commonJava/commonResources (see stonecutter.gradle). The
// authoritative loader source stays in fabric/src + neoforge/src + forge/src; Stonecutter
// links it into the active node automatically.
// ---------------------------------------------------------------------------
stonecutter {
    create(rootProject) {
        // 1.21.x: one cell per API line (1.21.8 also covers 1.21.7, 1.21.10 also covers 1.21.9 - see
        // mc_floor_<v> / mc_ceiling_<v> in gradle.properties).
        def mcVersions = ['1.21.1', '1.21.4', '1.21.5', '1.21.8', '1.21.10', '1.21.11', '26.1.2', '26.2', '26.3']
        branch('fabric')   { versions(*mcVersions) }
        branch('neoforge') { versions(*mcVersions) }
        branch('forge')    { versions(*mcVersions) }
        vcsVersion = '26.2'   // reset point for commits / default checkout
    }
}
