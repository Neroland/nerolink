# ----------------------------------------------------------------------------
# NeroLink cross-loader build — MultiLoader-Template (ModDevGradle + Fabric Loom + ForgeGradle)
#
# Barebones skeleton scaffolded to match the Nerospace build exactly. Run from
# the repo root with its Gradle 9.6.0 wrapper.
#
# Layout (no architectury-loom):
#   common   -> net.neoforged.moddev, NeoForm-only (de-obfuscated vanilla); spliced into each node
#   fabric   -> net.fabricmc.fabric-loom (omits `mappings` for de-obf 26.x)
#   neoforge -> net.neoforged.moddev (full NeoForge userdev)
#   forge    -> net.minecraftforge.gradle (full Forge userdev)
# common's source is shared into fabric/neoforge/forge (one copy -> no drift).
#
# Version axis = Stonecutter: each loader x MC version is its own node
# (:fabric:26.1.2 :fabric:26.2 :fabric:26.3 :neoforge:26.1.2 :neoforge:26.2 :neoforge:26.3 :forge:26.1.2 :forge:26.2 :forge:26.3).
# ----------------------------------------------------------------------------

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
# ModDevGradle/Loom do not always agree with the configuration cache; off here.
org.gradle.configuration-cache=false

## Mod metadata (shared by all loaders) --------------------------------------
mod_id=nerolink
mod_name=NeroLink
# The mod version is independent of the Minecraft version; it is the same for all builds.
mod_version=0.2.0-alpha.1
mod_group_id=za.co.neroland.nerolink
mod_license=All Rights Reserved (modpacks allowed - see LICENSE)
mod_authors=Neroland

## Neroland Core — shared foundation library (required dependency, loads BEFORE NeroLink).
## Consumed per-loader as za.co.neroland.nerolandcore:nerolandcore-<loader>-<mc>:<this>. Resolved from
## GitHub Packages in CI/fresh clones, or mavenLocal() for local dev (run `./gradlew publishToMavenLocal`
## in ../neroland-core). NeroLink builds against Core's link API (za.co.neroland.nerolandcore.link) —
## the SnapshotProvider/ActionHandler SPI, LinkEventBus, LinkAlerts, progression gates, config, erasure.
nerolandcore_version=1.13.0

## IDE-active Minecraft default (Stonecutter) --------------------------------
minecraft_version=26.2

## Version matrix (CI iterates these) ---------------------------------------
mc_versions=26.1.2,26.2,26.3

## NeoForm — de-obfuscated vanilla base the `common` module compiles against
neo_form_version_26.1.2=26.1.2-1
neo_form_version_26.2=26.2-2
neo_form_version_26.3=26.3-1

## NeoForge userdev — the `neoforge` module
neo_version_26.1.2=26.1.2.109
neo_version_26.2=26.2.0.88
neo_version_26.3=26.3.0.22-beta

## MinecraftForge / Forge userdev — the `forge` module
forge_version_26.1.2=26.1.2-64.1.3
forge_version_26.2=26.2-65.1.3
forge_version_26.3=26.3-66.0.4

## JEI (mezz.jei, BlameJared maven) — common API recipe-viewer compat
jei_version_26.1.2=29.43.0.105
jei_version_26.2=30.38.0.230
jei_version_26.3=31.7.0.42

## EMI — optional recipe-viewer compat. Official EMI has no MC 26.x release, so this pins the community
## "EMI Unofficial Port (Unstable)" (CurseForge project 1544558, MIT, upstream dev.emi.emi.api unchanged),
## fetched through CurseMaven by CurseForge FILE id. NeoForge + Fabric only; the Forge cells compile
## against the NeoForge file (API only). Dev clients load EMI only with -PwithEmi.
emi_file_neoforge_26.1.2=8630349
emi_file_neoforge_26.2=8616659
emi_file_neoforge_26.3=8897084
emi_file_fabric_26.1.2=8630346
emi_file_fabric_26.2=8616656
emi_file_fabric_26.3=8897080

## Fabric (https://fabricmc.net/develop) ------------------------------------
fabric_loader_version=0.19.5
fabric_api_version_26.1.2=0.155.3+26.1.2
fabric_api_version_26.2=0.161.0+26.2
fabric_api_version_26.3=0.161.0+26.3
