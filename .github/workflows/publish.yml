name: Publish

# Builds and publishes every supported loader and Minecraft version combination
# whenever the mod_version in gradle.properties has no published release yet.
#
# The build matrix compiles and tests each supported cell on its own runner.
# Maven publishing and distribution packaging start after every build succeeds.
# CurseForge uploads run serially, then the GitHub release records the version tag.
#
# Re-runs are safe: an already-released version (tag exists) is skipped. `workflow_dispatch`
# runs the same check manually (catch up a missed release without a dummy commit).
#
# Supply chain: third-party actions are pinned to commit SHAs (these steps hold publish
# tokens); the trailing `# vX` comment is the human-readable tag for Dependabot/updates.
# Privacy (POPIA/GDPR): only version strings + curated release notes are handled or logged -
# no personal data.

on:
  push:
    branches: [main, enhancement/multi-loader-support]
    paths:
      - gradle.properties
  workflow_dispatch:

# Least privilege by default; only the `release` job is granted write to create the Release/tag.
permissions:
  contents: read

jobs:
  detect:
    name: Detect unreleased version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.cells.outputs.matrix }}
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Tags are the release ledger - fetch them for the existence check.
          fetch-depth: 1
          fetch-tags: true

      - name: Check whether mod_version already has a release tag
        id: check
        run: |
          read_version() { grep -E '^mod_version=' "$1" | head -n1 | cut -d= -f2 | tr -d '[:space:]'; }

          CURRENT="$(read_version gradle.properties)"
          echo "current=$CURRENT"

          if [ -z "$CURRENT" ]; then
            echo "::error::Could not read mod_version from gradle.properties"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$CURRENT" >/dev/null; then
            echo "v$CURRENT is already released (tag exists); skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$CURRENT has no release tag yet; publishing."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Define supported release cells
        id: cells
        shell: bash
        run: |
          matrix="$(jq -c . <<'CELLS'
          {"include":[
            {"loader": "fabric", "mc": "1.20", "games": "1.20", "label": "Fabric", "suffix": ""},
            {"loader": "fabric", "mc": "1.20.1", "games": "1.20.1", "label": "Fabric", "suffix": ""},
            {"loader": "fabric", "mc": "1.20.2", "games": "1.20.2", "label": "Fabric", "suffix": ""},
            {"loader": "fabric", "mc": "1.20.3", "games": "1.20.3", "label": "Fabric", "suffix": ""},
            {"loader": "fabric", "mc": "1.20.4", "games": "1.20.4", "label": "Fabric", "suffix": ""},
            {"loader": "fabric", "mc": "1.20.5", "games": "1.20.5", "label": "Fabric", "suffix": ""},
            {"loader": "fabric", "mc": "1.20.6", "games": "1.20.6", "label": "Fabric", "suffix": ""},
            {"loader": "fabric", "mc": "1.21.1", "games": "1.21.1", "label": "Fabric", "suffix": ""},
            {"loader": "fabric", "mc": "1.21.4", "games": "1.21.4", "label": "Fabric", "suffix": ""},
            {"loader": "fabric", "mc": "1.21.5", "games": "1.21.5", "label": "Fabric", "suffix": ""},
            {"loader": "fabric", "mc": "1.21.8", "games": "1.21.7,1.21.8", "label": "Fabric", "suffix": ""},
            {"loader": "fabric", "mc": "1.21.10", "games": "1.21.9,1.21.10", "label": "Fabric", "suffix": ""},
            {"loader": "fabric", "mc": "1.21.11", "games": "1.21.11", "label": "Fabric", "suffix": ""},
            {"loader": "fabric", "mc": "26.1.2", "games": "26.1.2", "label": "Fabric", "suffix": ""},
            {"loader": "fabric", "mc": "26.2", "games": "26.2", "label": "Fabric", "suffix": ""},
            {"loader": "fabric", "mc": "26.3", "games": "26.3", "label": "Fabric", "suffix": ""},
            {"loader": "neoforge", "mc": "1.20.4", "games": "1.20.4", "label": "NeoForge", "suffix": ""},
            {"loader": "neoforge", "mc": "1.20.6", "games": "1.20.6", "label": "NeoForge", "suffix": ""},
            {"loader": "neoforge", "mc": "1.21.1", "games": "1.21.1", "label": "NeoForge", "suffix": ""},
            {"loader": "neoforge", "mc": "1.21.4", "games": "1.21.4", "label": "NeoForge", "suffix": ""},
            {"loader": "neoforge", "mc": "1.21.5", "games": "1.21.5", "label": "NeoForge", "suffix": ""},
            {"loader": "neoforge", "mc": "1.21.8", "games": "1.21.7,1.21.8", "label": "NeoForge", "suffix": ""},
            {"loader": "neoforge", "mc": "1.21.10", "games": "1.21.9,1.21.10", "label": "NeoForge", "suffix": ""},
            {"loader": "neoforge", "mc": "1.21.11", "games": "1.21.11", "label": "NeoForge", "suffix": ""},
            {"loader": "neoforge", "mc": "26.1.2", "games": "26.1.2", "label": "NeoForge", "suffix": ""},
            {"loader": "neoforge", "mc": "26.2", "games": "26.2", "label": "NeoForge", "suffix": ""},
            {"loader": "neoforge", "mc": "26.3", "games": "26.3", "label": "NeoForge", "suffix": ""},
            {"loader": "forge", "mc": "1.20", "games": "1.20", "label": "Forge", "suffix": "-all"},
            {"loader": "forge", "mc": "1.20.1", "games": "1.20.1", "label": "Forge", "suffix": "-all"},
            {"loader": "forge", "mc": "1.20.2", "games": "1.20.2", "label": "Forge", "suffix": "-all"},
            {"loader": "forge", "mc": "1.20.3", "games": "1.20.3", "label": "Forge", "suffix": "-all"},
            {"loader": "forge", "mc": "1.20.4", "games": "1.20.4", "label": "Forge", "suffix": "-all"},
            {"loader": "forge", "mc": "1.20.6", "games": "1.20.6", "label": "Forge", "suffix": "-all"},
            {"loader": "forge", "mc": "1.21.1", "games": "1.21.1", "label": "Forge", "suffix": "-all"},
            {"loader": "forge", "mc": "1.21.4", "games": "1.21.4", "label": "Forge", "suffix": "-all"},
            {"loader": "forge", "mc": "1.21.5", "games": "1.21.5", "label": "Forge", "suffix": "-all"},
            {"loader": "forge", "mc": "1.21.8", "games": "1.21.7,1.21.8", "label": "Forge", "suffix": "-all"},
            {"loader": "forge", "mc": "1.21.10", "games": "1.21.9,1.21.10", "label": "Forge", "suffix": "-all"},
            {"loader": "forge", "mc": "1.21.11", "games": "1.21.11", "label": "Forge", "suffix": "-all"},
            {"loader": "forge", "mc": "26.1.2", "games": "26.1.2", "label": "Forge", "suffix": "-all"},
            {"loader": "forge", "mc": "26.2", "games": "26.2", "label": "Forge", "suffix": "-all"},
            {"loader": "forge", "mc": "26.3", "games": "26.3", "label": "Forge", "suffix": "-all"}
          ]}
          CELLS
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }} ${{ matrix.mc }}
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1

      - name: Set up JDKs 17, 21 and 25
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
        with:
          java-version: |
            17
            21
            25
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # --- Neroland Core dependency ---
      # Core is consumed as a published Maven artifact from GitHub Packages (see the
      # NerolandCoreGitHubPackages repo in stonecutter.gradle). The version comes solely from
      # nerolandcore_version in gradle.properties — no Core checkout/build here, so no pinned-ref
      # drift. Gradle reads GITHUB_ACTOR/GITHUB_TOKEN below to authenticate the package read. The
      # package must be readable by this repo (Core package = Internal visibility, or granted),
      # otherwise add an org PAT secret with read:packages and use it in place of GITHUB_TOKEN.
      # See USING-CORE.md.
      # --- end Neroland Core dependency ---

      - name: Build and stage this release cell
        shell: bash
        env:
          LOADER: ${{ matrix.loader }}
          MC: ${{ matrix.mc }}
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ needs.detect.outputs.version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mod="$(grep -E '^mod_id=' gradle.properties | cut -d= -f2)"
          group="$(grep -E '^mod_group_id=' gradle.properties | cut -d= -f2)"
          artifact="$mod-$LOADER-$MC"
          local_repo="$RUNNER_TEMP/cell-maven"
          ./gradlew ":$LOADER:$MC:build" ":$LOADER:$MC:publishModPublicationToMavenLocal" \
            "-Dmaven.repo.local=$local_repo" --configure-on-demand --max-workers=2 --stacktrace

          maven="$local_repo/$(printf '%s' "$group" | tr '.' '/')/$artifact/$VERSION/$artifact-$VERSION"
          jar="$artifact-$VERSION$SUFFIX.jar"
          mkdir -p cell/dist
          cp "$LOADER/versions/$MC/build/libs/$jar" "cell/dist/$jar"
          cp "$maven.pom" cell/maven.pom
          if [ -n "$SUFFIX" ]; then
            cp "$maven.jar" cell/maven.jar
          else
            cmp "$maven.jar" "cell/dist/$jar"
          fi

      - name: Upload this release cell
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.loader }}-${{ matrix.mc }}
          path: cell/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  package_release:
    name: Publish Maven artifacts and prepare distribution
    needs: [detect, build]
    if: needs.detect.outputs.changed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      environment: ${{ steps.channel.outputs.environment }}
      version_type: ${{ steps.channel.outputs.version_type }}
    env:
      MATRIX: ${{ needs.detect.outputs.matrix }}
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1

      - name: Download all successful build cells
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: build-*
          path: built

      - name: Verify and collect all distributables
        shell: bash
        run: |
          mod="$(grep -E '^mod_id=' gradle.properties | cut -d= -f2)"
          mkdir -p dist
          cells="$(jq -er '.include[] | [.loader, .mc, .suffix] | @tsv' <<< "$MATRIX")"
          while IFS=$'\t' read -r loader mc suffix; do
            cell="built/build-$loader-$mc"
            jar="$mod-$loader-$mc-$VERSION$suffix.jar"
            maven_jar="$cell/dist/$jar"
            if [ -n "$suffix" ]; then
              maven_jar="$cell/maven.jar"
            fi
            for file in "$cell/dist/$jar" "$cell/maven.pom" "$maven_jar"; do
              if [ ! -s "$file" ]; then
                echo "::error::Missing or empty build artifact $file"
                exit 1
              fi
            done
            cp "$cell/dist/$jar" "dist/$jar"
          done <<< "$cells"

      - name: Publish Maven artifacts to GitHub Packages
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mod="$(grep -E '^mod_id=' gradle.properties | cut -d= -f2)"
          group="$(grep -E '^mod_group_id=' gradle.properties | cut -d= -f2)"
          repository="https://maven.pkg.github.com/$GITHUB_REPOSITORY"
          group_path="$(printf '%s' "$group" | tr '.' '/')"
          settings="$RUNNER_TEMP/github-maven-settings.xml"
          cat > "$settings" <<'MAVEN_SETTINGS'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          MAVEN_SETTINGS

          status_for() {
            curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' \
              --user "$GITHUB_ACTOR:$GITHUB_TOKEN" "$1"
          }

          cells="$(jq -er '.include[] | [.loader, .mc, .suffix] | @tsv' <<< "$MATRIX")"
          while IFS=$'\t' read -r loader mc suffix; do
            artifact="$mod-$loader-$mc"
            url="$repository/$group_path/$artifact/$VERSION/$artifact-$VERSION"
            jar_status="$(status_for "$url.jar")"
            pom_status="$(status_for "$url.pom")"
            case "$jar_status/$pom_status" in
              200/200)
                echo "$artifact $VERSION is already published"
                continue
                ;;
              404/404) ;;
              *)
                echo "::error::Unexpected GitHub Packages status for $artifact $VERSION (jar $jar_status, POM $pom_status)"
                exit 1
                ;;
            esac

            cell="built/build-$loader-$mc"
            jar="$cell/dist/$artifact-$VERSION$suffix.jar"
            if [ -n "$suffix" ]; then
              jar="$cell/maven.jar"
            fi
            mvn --batch-mode --no-transfer-progress --settings "$settings" \
              org.apache.maven.plugins:maven-deploy-plugin:3.1.3:deploy-file \
              -DrepositoryId=github "-Durl=$repository" "-Dfile=$jar" \
              "-DpomFile=$cell/maven.pom" -DretryFailedDeploymentCount=4
          done <<< "$cells"

      - name: Determine release channel
        id: channel
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          case "$VERSION" in
            *-alpha*) echo "environment=alpha"      >> "$GITHUB_OUTPUT"
                      echo "version_type=alpha"     >> "$GITHUB_OUTPUT" ;;
            *-beta*)  echo "environment=beta"       >> "$GITHUB_OUTPUT"
                      echo "version_type=beta"      >> "$GITHUB_OUTPUT" ;;
            *)        echo "environment=production" >> "$GITHUB_OUTPUT"
                      echo "version_type=release"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Extract changelog section
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::warning::CHANGELOG.md not found; using a placeholder."
            echo "See CHANGELOG.md for details." > RELEASE_NOTES.md
          else
            awk -v ver="$VERSION" '
              !found && index($0, "## [" ver "]") == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found && /^\[[^]]+\]: / { next }   # skip link-definition lines
              found { print }
            ' CHANGELOG.md > RELEASE_NOTES.md
            if [ ! -s RELEASE_NOTES.md ]; then
              echo "::warning::No CHANGELOG.md section for $VERSION; using a placeholder."
              echo "See CHANGELOG.md for details." > RELEASE_NOTES.md
            fi
          fi
          cat RELEASE_NOTES.md

      - name: Add release notes to the distribution
        run: cp RELEASE_NOTES.md dist/

      - name: Upload distributables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          overwrite: true
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.label }} ${{ matrix.mc }} (CurseForge)
    needs: [detect, package_release]
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # STRICTLY one upload at a time. At max-parallel 2 the CurseForge upload endpoint
      # returned generic HTTP 500s for concurrent uploads to the same project. Serial
      # uploads + the retry loop in the CurseForge step below make the matrix
      # deterministic.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}

    steps:
      - name: Download distributables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      # CurseForge requires every Minecraft Java file to declare its environment
      # (Client / Server) from 2026-07-15 - enforced by the upload API. mc-publish
      # cannot set this field, so this jar is uploaded to CurseForge directly here,
      # with gameVersionNames carrying the Minecraft version, the loader AND both
      # environments. NeroLink runs on BOTH sides, so Client + Server are both tagged.
      # Privacy (POPIA/GDPR): only version strings, loader/MC names and the curated
      # changelog are sent or logged - no personal data.
      - name: Upload to CurseForge (with environment)
        env:
          CF_API_TOKEN: ${{ secrets.CURSE_FORGE_API_TOKEN }}
          CF_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          DISPLAY_NAME: NeroLink ${{ needs.detect.outputs.version }} - ${{ matrix.label }} ${{ matrix.mc }}
          RELEASE_TYPE: ${{ needs.package_release.outputs.version_type }}
          MC_VERSION: ${{ matrix.games }}
          CF_LOADER: ${{ matrix.label }}
          JAR: dist/nerolink-${{ matrix.loader }}-${{ matrix.mc }}-${{ needs.detect.outputs.version }}${{ matrix.suffix }}.jar
        run: |
          if [ ! -f "$JAR" ]; then
            echo "::error::Jar not found for CurseForge upload: $JAR"
            exit 1
          fi

          # gameVersionNames carries the Minecraft version, the loader and BOTH
          # environments (Client + Server) - the environment tags are what CurseForge
          # now requires. --rawfile embeds the changelog verbatim (safe JSON encoding).
          jq -n \
            --rawfile changelog dist/RELEASE_NOTES.md \
            --arg name "$DISPLAY_NAME" \
            --arg rt "$RELEASE_TYPE" \
            --arg mc "$MC_VERSION" \
            --arg loader "$CF_LOADER" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $name,
              releaseType: $rt,
              gameVersionNames: (($mc | split(",")) + [$loader, "Client", "Server"])
            }' > cf_metadata.json

          # CurseForge's upload endpoint intermittently answers a generic HTTP 500
          # ("An unhandled exception occurred") under load — retry 5xx with backoff.
          # 4xx responses are real request errors and fail immediately (no retry), so a
          # bad token/metadata never spams the API.
          ATTEMPTS=4
          for i in $(seq 1 $ATTEMPTS); do
            HTTP_CODE=$(curl -sS -o cf_response.json -w "%{http_code}" \
              -X POST "https://minecraft.curseforge.com/api/projects/${CF_PROJECT_ID}/upload-file" \
              -H "X-Api-Token: ${CF_API_TOKEN}" \
              -F "metadata=<cf_metadata.json" \
              -F "file=@${JAR}")

            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi
            if [ "$HTTP_CODE" -lt 500 ]; then
              echo "::error::CurseForge upload returned HTTP $HTTP_CODE (not retryable)"
              cat cf_response.json
              exit 1
            fi
            if [ "$i" = "$ATTEMPTS" ]; then
              echo "::error::CurseForge upload returned HTTP $HTTP_CODE after $ATTEMPTS attempts"
              cat cf_response.json
              exit 1
            fi
            echo "CurseForge upload attempt $i/$ATTEMPTS returned HTTP $HTTP_CODE - retrying in 30s..."
            cat cf_response.json
            sleep 30
          done
          echo "CurseForge upload OK (HTTP 200): file id $(jq -r '.id' cf_response.json) - $MC_VERSION / $CF_LOADER / Client+Server"

  release:
    name: GitHub Release + Sentry
    needs: [detect, package_release, publish]
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + v<version> tag
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download distributables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      # Register the release in Sentry so error reports group per mod version. The release name
      # must match what the SDK sends (NeroLinkTelemetry: release "nerolink@<mod_version>").
      # Requires repository secrets: SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT.
      - name: Create Sentry release
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          release: nerolink@${{ needs.detect.outputs.version }}
          environment: ${{ needs.package_release.outputs.environment }}

      # One GitHub Release carrying all six jars. This also creates the v<version> tag that
      # `detect` reads as the release ledger - intentionally the LAST step, so a failed CurseForge
      # upload above leaves no tag and a re-run retries cleanly instead of being skipped.
      - name: Publish GitHub Release
        uses: Kir-Antipov/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659 # v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: v${{ needs.detect.outputs.version }}
          name: NeroLink ${{ needs.detect.outputs.version }}
          version: ${{ needs.detect.outputs.version }}
          version-type: ${{ needs.package_release.outputs.version_type }}
          changelog-file: dist/RELEASE_NOTES.md
          # dist/ holds exactly the six distributables (Forge = -all), so this glob is precise.
          files: dist/*.jar
          java: 25

      # Best-effort Discord announcement of the new release. Runs last and is non-fatal
      # (continue-on-error) so a Discord outage can never block a release - the v<version> tag
      # has already been created above. Auto-skips if the DISCORD_WEBHOOK_URL secret is unset.
      # Privacy (POPIA/GDPR): posts only the mod name, version, release URL and the curated
      # changelog section - no personal data.
      - name: Announce release on Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MOD_NAME: NeroLink
          AVATAR_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/art/logo/nerolink_logo_400.png
          VERSION: ${{ needs.detect.outputs.version }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.detect.outputs.version }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping Discord announcement."
            exit 0
          fi

          # Shortened changelog from the release notes built earlier. Trim to keep the embed
          # readable and within Discord's 4096-char description limit; add an ellipsis if cut.
          NOTES=dist/RELEASE_NOTES.md
          if [ -s "$NOTES" ]; then
            CHANGELOG="$(head -c 1500 "$NOTES")"
            [ "$(wc -c < "$NOTES")" -gt 1500 ] && CHANGELOG="${CHANGELOG}"$'\n\n…'
          else
            CHANGELOG="See the release notes for details."
          fi

          # jq builds the payload so the changelog is safely JSON-escaped.
          PAYLOAD="$(jq -n \
            --arg name "$MOD_NAME" \
            --arg avatar "$AVATAR_URL" \
            --arg version "$VERSION" \
            --arg url "$RELEASE_URL" \
            --arg changelog "$CHANGELOG" \
            '{username: $name, avatar_url: $avatar, embeds: [{
               title: "🚀 \($name) v\($version) released",
               url: $url,
