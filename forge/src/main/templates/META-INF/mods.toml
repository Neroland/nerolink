modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${mod_license}"
logoFile = "nerolink_logo.png"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
displayURL = "https://neroland.co.za"
description = '''
Server-side bridge for the NeroLink companion app: pair your phone in-game and see your Neroland base live - energy, quests, progression and more - over a pinned TLS connection or the NeroLink relay. Requires Neroland Core.
'''

[[mixins]]
config = "nerolink-common.mixins.json"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_loader_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Neroland Core — required shared foundation; must load BEFORE NeroLink (ordering = AFTER).
[[dependencies.${mod_id}]]
modId = "nerolandcore"
mandatory = true
versionRange = "${nerolandcore_version_range}"
ordering = "AFTER"
side = "BOTH"
